plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.nanonaitor.forgedarmor'
version = '0.1.2'
base.archivesName = 'nanonaitor-forged-armor-1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            mods { nanonaitor_forged_armor { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.18' }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
jar.finalizedBy('reobfJar')
